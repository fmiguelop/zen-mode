<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still — Options</title>
    <style>
      :root {
        --still-paper: #f5f5f0;
        --still-ink: #1a1a18;
        --still-muted: #6b6b66;
        --still-border: #e0e0db;
        --still-sage: #5c7a6b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1.5rem 1.25rem 2rem;
        background: var(--still-paper);
        color: var(--still-ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 0.9375rem;
        line-height: 1.5;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.125rem;
        font-weight: 700;
      }

      section {
        margin-bottom: 1.75rem;
      }

      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--still-muted);
      }

      fieldset {
        margin: 0;
        padding: 0;
        border: none;
      }

      label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        cursor: pointer;
      }

      label:last-child {
        margin-bottom: 0;
      }

      input[type='radio'] {
        accent-color: var(--still-sage);
      }

      p {
        margin: 0;
        color: var(--still-muted);
        font-size: 0.875rem;
      }

      p + p {
        margin-top: 0.5rem;
      }

      kbd {
        display: inline-block;
        padding: 0.125rem 0.375rem;
        border: 1px solid var(--still-border);
        border-radius: 4px;
        background: #fafaf5;
        font-family: inherit;
        font-size: 0.8125rem;
      }

      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--still-border);
        font-size: 0.8125rem;
        color: var(--still-muted);
      }
    </style>
  </head>
  <body>
    <h1>Still</h1>

    <section>
      <h2>Appearance</h2>
      <fieldset>
        <label>
          <input type="radio" name="theme" value="light" />
          Light
        </label>
        <label>
          <input type="radio" name="theme" value="dark" />
          Dark
        </label>
        <label>
          <input type="radio" name="theme" value="warm" />
          Warm
        </label>
      </fieldset>
    </section>

    <section>
      <h2>Text size</h2>
      <fieldset>
        <label>
          <input type="radio" name="fontSize" value="small" />
          Small
        </label>
        <label>
          <input type="radio" name="fontSize" value="medium" />
          Medium
        </label>
        <label>
          <input type="radio" name="fontSize" value="large" />
          Large
        </label>
      </fieldset>
    </section>

    <section>
      <h2>Column width</h2>
      <fieldset>
        <label>
          <input type="radio" name="columnWidth" value="narrow" />
          Narrow
        </label>
        <label>
          <input type="radio" name="columnWidth" value="default" />
          Default
        </label>
        <label>
          <input type="radio" name="columnWidth" value="wide" />
          Wide
        </label>
      </fieldset>
    </section>

    <section>
      <h2>Keyboard shortcut</h2>
      <p>
        Toggle Still: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> (Mac: <kbd>Option</kbd> +
        <kbd>Shift</kbd> + <kbd>S</kbd>)
      </p>
      <p>
        In reader: <kbd>+</kbd> / <kbd>−</kbd> to adjust text size, <kbd>Esc</kbd> to exit.
      </p>
      <p>
        To change the toggle shortcut, open <strong>chrome://extensions/shortcuts</strong> and find
        Still.
      </p>
    </section>

    <footer>Still works with zero configuration.</footer>

    <script type="module" src="~/utils/options-page.ts"></script>
  </body>
</html>
